  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-display: 'Syne', sans-serif;
      --font-body: 'Outfit', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }
    body {
      font-family: var(--font-body);
    }
    .font-display {
      font-family: var(--font-display);
    }
    .font-mono-tech {
      font-family: var(--font-mono);
    }

    .timer-digits {
      font-family: var(--font-display);
      font-variant-numeric: tabular-nums;
      line-height: 0.9;
    }

    @keyframes epic-shake {
      0% { transform: translate(0, 0) scale(1); }
      10% { transform: translate(-10px, 8px) rotate(-1.5deg) scale(1.02); }
      20% { transform: translate(9px, -9px) rotate(1.5deg) scale(1.03); }
      30% { transform: translate(-8px, -6px) rotate(-1deg) scale(1.02); }
      40% { transform: translate(8px, 6px) rotate(1deg) scale(1.01); }
      50% { transform: translate(-5px, 4px) rotate(-0.5deg) scale(1); }
      70% { transform: translate(4px, -3px) rotate(0.5deg); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes shock-flash {
      0% { opacity: 0; transform: scale(0.8); }
      40% { opacity: 0.95; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1.4); }
    }

    @keyframes holographic-shine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes cursor-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .shake-trigger {
      animation: epic-shake 0.65s cubic-bezier(.36,.07,.19,.97) both;
    }

    .flash-active {
      animation: shock-flash 0.8s ease-out forwards;
    }

    .holo-gradient {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 25%, #7f00ff 50%, #e100ff 75%, #00f2fe 100%);
      background-size: 300% 300%;
      animation: holographic-shine 6s ease infinite;
    }

    .glass-specular {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    .svg-ring-smooth {
      transition: stroke-dashoffset 0.85s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }

    .cyber-cursor {
      animation: cursor-blink 0.8s infinite;
    }

    .char-decoding {
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
    }
  </style>
</head>

  <script>
    // --- 1. PARTICLES CANVAS ---
    const canvas = document.getElementById('constellation-canvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth || 400);
    let height = (canvas.height = window.innerHeight || 600);

    let mouse = { x: null, y: null, radius: 140 };
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth || 400;
      height = canvas.height = window.innerHeight || 600;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        if (mouse.x !== null) {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let dist = Math.hypot(dx, dy);
          if (dist < mouse.radius) {
            let angle = Math.atan2(dy, dx);
            this.x -= Math.cos(angle) * 1.5;
            this.y -= Math.sin(angle) * 1.5;
          }
        }
      }
      draw() {
        ctx.fillStyle = 'rgba(34, 211, 238, 0.6)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particlesArray = Array.from({ length: 45 }, () => new Particle());

    function renderCanvas() {
      ctx.clearRect(0, 0, width, height);
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a + 1; b < particlesArray.length; b++) {
          let dist = Math.hypot(particlesArray[a].x - particlesArray[b].x, particlesArray[a].y - particlesArray[b].y);
          if (dist < 100) {
            ctx.strokeStyle = `rgba(147, 51, 234, ${0.25 * (1 - dist / 100)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
      particlesArray.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(renderCanvas);
    }
    renderCanvas();

    // --- 2. MATRIX SCRAMBLE TEXT ---
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
    let scrambleInterval = null;

    function scramble(element, targetText) {
      let step = 0;
      const totalSteps = targetText.length;
      clearInterval(scrambleInterval);

      scrambleInterval = setInterval(() => {
        let outputHTML = "";
        for (let i = 0; i < totalSteps; i++) {
          if (i < Math.floor(step)) {
            outputHTML += `<span class="text-cyan-300">${targetText[i]}</span>`;
          } else if (i === Math.floor(step)) {
            const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
            outputHTML += `<span class="char-decoding font-bold">${randomChar}</span>`;
          } else {
            const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
            outputHTML += `<span class="text-slate-600 opacity-60">${randomChar}</span>`;
          }
        }
        element.innerHTML = outputHTML;

        if (step >= totalSteps) {
          clearInterval(scrambleInterval);
          element.innerHTML = `<span class="text-cyan-300 drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]">${targetText}</span>`;
        }
        step += 0.45;
      }, 30);
    }

    // --- 3. URL HASH ROUTER ---
    let activeConfig = null;

    window.addEventListener('DOMContentLoaded', (
