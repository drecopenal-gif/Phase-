<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Link Router & Admin Panel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #05070f;
      --card-bg: rgba(13, 18, 30, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --success: #00f296;
      --success-glow: rgba(0, 242, 150, 0.4);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.45);
      --text: #ffffff;
      --text-muted: #8b9bb4;
      --input-bg: #080c16;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glows */
    .glow-blob-1, .glow-blob-2 {
      position: absolute;
      width: 450px;
      height: 450px;
      filter: blur(100px);
      pointer-events: none;
      border-radius: 50%;
      z-index: 0;
    }
    .glow-blob-1 {
      background: radial-gradient(circle, rgba(0, 242, 150, 0.12), transparent 70%);
      top: 5%;
      left: 10%;
    }
    .glow-blob-2 {
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18), transparent 70%);
      bottom: 5%;
      right: 10%;
    }

    .container-box {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 30px;
      max-width: 680px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 1;
      text-align: center;
    }

    /* Shake */
    .container-box.impact-shake {
      animation: cyberShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes cyberShake {
      10%, 90% { transform: translate3d(-2px, -1px, 0); }
      20%, 80% { transform: translate3d(3px, 2px, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, -3px, 0); }
      40%, 60% { transform: translate3d(5px, 3px, 0); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.35);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 20px;
    }
    .badge i {
      color: #818cf8;
      animation: flash 1.5s infinite;
    }
    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 10px;
    }
    p.desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    /* Dynamic Progress Area */
    .progress-wrapper {
      position: relative;
      margin-bottom: 20px;
      padding: 0 10px;
    }
    .line-bg {
      position: absolute;
      top: 28px;
      height: 6px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      z-index: 1;
    }
    .line-fill {
      position: absolute;
      top: 28px;
      height: 6px;
      background: linear-gradient(90deg, var(--success), var(--primary));
      border-radius: 10px;
      z-index: 2;
      box-shadow: 0 0 15px var(--primary-glow);
      transition: width linear;
    }
    .line-fill::after {
      content: '';
      position: absolute;
      right: 0;
      top: -3px;
      width: 12px;
      height: 12px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px #ffffff, 0 0 20px var(--primary);
      animation: pulseLight 1s infinite alternate;
    }
    @keyframes pulseLight {
      0% { transform: scale(0.8); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    .steps-container {
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 3;
    }
    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 1;
    }
    .circle-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #0d131f;
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      color: #4b586e;
      position: relative;
      z-index: 2;
      transition: all 0.4s ease;
    }
    .step-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* States */
    .step-item.completed .circle {
      background: var(--success);
      border-color: #5efcc0;
      color: #032115;
      box-shadow: 0 0 25px var(--success-glow);
    }
    .step-item.completed .step-title { color: var(--success); }

    .step-item.phase-reached .circle {
      background: #14192d;
      border-color: var(--primary);
      color: #ffffff;
      animation: explodeGlow 0.8s ease-out forwards;
    }
    .step-item.phase-reached .step-title {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
    }
    @keyframes explodeGlow {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.25); box-shadow: 0 0 45px var(--primary); }
      100% { transform: scale(1); box-shadow: 0 0 25px var(--primary-glow); }
    }
    .step-item.phase-reached .circle-container::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid var(--primary);
      animation: shockwave 1.2s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      z-index: 1;
    }
    @keyframes shockwave {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* Admin Form Elements */
    .admin-card {
      text-align: left;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.3s;
    }
    input:focus, select:focus {
      border-color: var(--primary);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .phase-builder-item {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn {
      cursor: pointer;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #818cf8);
      color: #ffffff;
      box-shadow: 0 0 20px var(--primary-glow);
      width: 100%;
      margin-top: 10px;
      font-size: 1rem;
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
    .btn-sm {
      padding: 8px 12px;
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
    }
    .result-box {
      margin-top: 25px;
      padding: 18px;
      background: #080d1a;
      border: 1px dashed var(--primary);
      border-radius: 16px;
      display: none;
    }
    .result-box input {
      margin: 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--success);
    }
  </style>
</head>
<body>

  <div class="glow-blob-1"></div>
  <div class="glow-blob-2"></div>

  <!-- ADMIN VIEW -->
  <div class="container-box admin-card" id="adminView">
    <div style="text-align: center;">
      <div class="badge"><i class="fa-solid fa-sliders"></i> Configuration Panel</div>
      <h1 style="margin-bottom: 25px;">Create Dynamic Router</h1>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-link"></i> Destination Link (Target URL)</label>
      <input type="url" id="cfgLink" placeholder="https://example.com/target-destination" value="https://google.com" required />
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-layer-group"></i> Roadmap Phases</label>
      <div id="phasesList">
        <div class="phase-builder-item">
          <input type="text" value="Phase 1: Setup" class="phase-name" />
          <button class="btn btn-sm btn-danger" onclick="removePhaseRow(this)"><i class="fa-solid fa-trash"></i></button>
        </div>
        <div class="phase-builder-item">
          <input type="text" value="Phase 2: Build" class="phase-name" />
          <button class="btn btn-sm btn-danger" onclick="removePhaseRow(this)"><i class="fa-solid fa-trash"></i></button>
        </div>
        <div class="phase-builder-item">
          <input type="text" value="Phase 3: Launch" class="phase-name" />
          <button class="btn btn-sm btn-danger" onclick="removePhaseRow(this)"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
      <button class="btn btn-sm" onclick="addPhaseRow()" style="margin-top: 5px;"><i class="fa-solid fa-plus"></i> Add Phase</button>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Start Phase</label>
        <select id="cfgStartPhase">
          <option value="1">Phase 1</option>
          <option value="2">Phase 2</option>
          <option value="3">Phase 3</option>
        </select>
      </div>
      <div class="form-group">
        <label>Target Phase</label>
        <select id="cfgTargetPhase">
          <option value="1">Phase 1</option>
          <option value="2" selected>Phase 2</option>
          <option value="3">Phase 3</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Animation Time (Seconds)</label>
        <input type="number" id="cfgDuration" value="2.2" step="0.1" min="0.5" />
      </div>
      <div class="form-group">
        <label>Auto-Redirect Delay (Seconds)</label>
        <input type="number" id="cfgRedirectDelay" value="1.5" step="0.1" min="0.5" />
      </div>
    </div>

    <button class="btn btn-primary" onclick="generateShareableLink()">
      <i class="fa-solid fa-bolt"></i> Generate Shareable Link
    </button>

    <div class="result-box" id="resultBox">
      <label><i class="fa-solid fa-share-nodes"></i> Shareable Generated Link:</label>
      <input type="text" id="shareUrlInput" readonly />
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-sm" style="flex: 1;" onclick="copyLink()"><i class="fa-solid fa-copy"></i> Copy Link</button>
        <button class="btn btn-sm btn-primary" style="flex: 1; margin:0;" onclick="testLink()"><i class="fa-solid fa-arrow-up-right-from-square"></i> Test Run</button>
      </div>
    </div>
  </div>

  <!-- PUBLIC TRACKER / ROUTER VIEW -->
  <div class="container-box" id="trackerView" style="display: none;">
    <div class="badge">
      <i class="fa-solid fa-bolt"></i> Processing Sequence
    </div>

    <h1 id="viewTitle">System Initializing</h1>
    <p class="desc" id="viewDesc">Validating execution pipeline and redirecting...</p>

    <div class="progress-wrapper">
      <div class="line-bg" id="lineBg"></div>
      <div class="line-fill" id="lineFill"></div>
      <div class="steps-container" id="stepsContainer"></div>
    </div>
  </div>

  <script>
    // 1. Dynamic Phase Builder inside Admin Panel
    function updateDropdowns() {
      const names = document.querySelectorAll('.phase-name');
      const startSel = document.getElementById('cfgStartPhase');
      const targetSel = document.getElementById('cfgTargetPhase');
      
      const prevStart = startSel.value;
      const prevTarget = targetSel.value;

      startSel.innerHTML = '';
      targetSel.innerHTML = '';

      names.forEach((_, idx) => {
        const val = idx + 1;
        startSel.innerHTML += `<option value="${val}">Phase ${val}</option>`;
        targetSel.innerHTML += `<option value="${val}">Phase ${val}</option>`;
      });

      startSel.value = prevStart <= names.length ? prevStart : "1";
      targetSel.value = prevTarget <= names.length ? prevTarget : (names.length >= 2 ? "2" : "1");
    }

    function addPhaseRow() {
      const container = document.getElementById('phasesList');
      const count = container.children.length + 1;
      const div = document.createElement('div');
      div.className = 'phase-builder-item';
      div.innerHTML = `
        <input type="text" value="Phase ${count}: Action" class="phase-name" />
        <button class="btn btn-sm btn-danger" onclick="removePhaseRow(this)"><i class="fa-solid fa-trash"></i></button>
      `;
      container.appendChild(div);
      updateDropdowns();
    }

    function removePhaseRow(btn) {
      if(document.querySelectorAll('.phase-builder-item').length <= 2) {
        alert("Minimum 2 phases required!");
        return;
      }
      btn.parentElement.remove();
      updateDropdowns();
    }

    // 2. Encrypt & Generate Share URL
    function generateShareableLink() {
      const phases = [];
      document.querySelectorAll('.phase-name').forEach(input => phases.push(input.value));
      
      const payload = {
        url: document.getElementById('cfgLink').value,
        phases: phases,
        start: parseInt(document.getElementById('cfgStartPhase').value),
        target: parseInt(document.getElementById('cfgTargetPhase').value),
        dur: parseFloat(document.getElementById('cfgDuration').value),
        delay: parseFloat(document.getElementById('cfgRedirectDelay').value)
      };

      if(!payload.url.startsWith('http')) {
        alert("Please enter a valid URL with http:// or https://");
        return;
      }

      const encoded = btoa(encodeURIComponent(JSON.stringify(payload)));
      const fullUrl = window.location.origin + window.location.pathname + '?data=' + encoded;

      document.getElementById('shareUrlInput').value = fullUrl;
      document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
      const copyText = document.getElementById("shareUrlInput");
      copyText.select();
      navigator.clipboard.writeText(copyText.value);
      alert("Link copied to clipboard!");
    }

    function testLink() {
      window.location.href = document.getElementById('shareUrlInput').value;
    }

    // 3. Router View Execution (When Opening Shared Link)
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const rawData = params.get('data');

      if (!rawData) {
        updateDropdowns();
        return; // Stay in Admin Panel
      }

      // Hide Admin, Show Tracker
      document.getElementById('adminView').style.display = 'none';
      const trackerView = document.getElementById('trackerView');
      trackerView.style.display = 'block';

      try {
        const config = JSON.parse(decodeURIComponent(atob(rawData)));
        renderTrackerAndExecute(config);
      } catch (e) {
        alert('Invalid configuration payload!');
      }
    });

    function renderTrackerAndExecute(cfg) {
      const totalPhases = cfg.phases.length;
      const stepsContainer = document.getElementById('stepsContainer');
      const lineBg = document.getElementById('lineBg');
      const lineFill = document.getElementById('lineFill');

      // Build step nodes
      stepsContainer.innerHTML = '';
      cfg.phases.forEach((name, i) => {
        const pNum = i + 1;
        const isDone = pNum < cfg.target;
        const isTarget = pNum === cfg.target;

        const item = document.createElement('div');
        item.className = `step-item ${isDone ? 'completed' : ''}`;
        item.id = `step-node-${pNum}`;

        let icon = '<i class="fa-solid fa-lock"></i>';
        if (isDone) icon = '<i class="fa-solid fa-check"></i>';
        else if (isTarget) icon = '<i class="fa-solid fa-spinner fa-spin"></i>';

        item.innerHTML = `
          <div class="circle-container">
            <div class="circle">${icon}</div>
          </div>
          <span class="step-title">${name}</span>
        `;
        stepsContainer.appendChild(item);
      });

      // Align Background & Animated lines across elements
      const offsetPerStep = 100 / (totalPhases - 1);
      const startPercent = (cfg.start - 1) * offsetPerStep;
      const targetPercent = (cfg.target - 1) * offsetPerStep;

      lineBg.style.left = '5%';
      lineBg.style.width = '90%';

      lineFill.style.left = `calc(5% + (${startPercent}% * 0.9))`;
      lineFill.style.width = '0%';
      lineFill.style.transitionDuration = `${cfg.dur}s`;

      // Start line growth
      setTimeout(() => {
        const distancePercent = (targetPercent - startPercent) * 0.9;
        lineFill.style.width = `${distancePercent}%`;
      }, 300);

      // Trigger Finish (Shake + Haptics + Redirect)
      const finishTime = (cfg.dur * 1000) + 300;

      setTimeout(() => {
        const box = document.getElementById('trackerView');
        const targetNode = document.getElementById(`step-node-${cfg.target}`);

        // Shake & Glow FX
        box.classList.add('impact-shake');
        if (targetNode) targetNode.classList.add('phase-reached');

        // Haptics (Vibration)
        if ('vibrate' in navigator) {
          navigator.vibrate([100, 40, 60]);
        }

        // Auto Open Main Link
        setTimeout(() => {
          window.location.href = cfg.url;
        }, cfg.delay * 1000);

      }, finishTime);
    }
  </script>

</body>
</html>
